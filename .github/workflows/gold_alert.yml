name: Gold Price Alert

permissions:
  contents: write

# 串行化运行：避免相邻两次定时运行并发执行时，
# state.json / wb_notify_state.json 的 git push 互相冲突
concurrency:
  group: gold-monitor
  cancel-in-progress: false

on:
  # 外部定时服务精确触发（主要方式，通过 cron-job.org 调用 GitHub API）
  workflow_dispatch:
    inputs:
      force_send:
        description: "强制发送报告"
        type: boolean
        default: false
  # 保留 schedule 作为备份（避开整点，减少延迟）
  schedule:
    # 北京时间 07:00-07:45 (UTC 23:00-23:45)，避开整点
    - cron: "7,22,37,52 23 * * *"
    # 北京时间 08:00-23:00 (UTC 00:00-15:00)，避开整点
    - cron: "7,22,37,52 0-15 * * *"

jobs:
  check-gold-price:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gold monitor
        env:
          FORCE_SEND: ${{ github.event.inputs.force_send == 'true' && 'true' || 'false' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOLD_GRAMS: ${{ vars.GOLD_GRAMS }}
          INVESTED_AMOUNT: ${{ vars.INVESTED_AMOUNT }}
          DAILY_ALERT_PCT: ${{ vars.DAILY_ALERT_PCT }}
          WEEKLY_ALERT_PCT: ${{ vars.WEEKLY_ALERT_PCT }}
          DAILY_VOLATILITY_TIERS: ${{ vars.DAILY_VOLATILITY_TIERS }}
          WEEKLY_VOLATILITY_TIERS: ${{ vars.WEEKLY_VOLATILITY_TIERS }}
          REPORT_SLOTS: ${{ vars.REPORT_SLOTS }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python gold_monitor.py

      - name: Commit state file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add state.json
          git diff --staged --quiet || (git commit -m "Update state [skip ci]" && git push)

      - name: 联动 workbuddy 签到并推送邮件（兜底，每天一次，幂等去重）
        if: always()
        env:
          WB_TRIGGER_TOKEN: ${{ secrets.WB_TRIGGER_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          WB_NOTIFY_EMAIL: "1137206138@qq.com"
        run: |
          set -euo pipefail
          API="https://api.github.com"
          WB_REPO="ygh-wq/workbuddy_auto_checkin"
          auth=(-H "Authorization: Bearer ${WB_TRIGGER_TOKEN}" -H "Accept: application/vnd.github+json" -H "User-Agent: gold-monitor")

          if [ -z "${WB_TRIGGER_TOKEN}" ]; then
            echo "::warning::未配置 WB_TRIGGER_TOKEN，跳过联动"
            exit 0
          fi

          # 解耦设计：wb 签到以 workbuddy_auto_checkin 仓库自身的 schedule 为主
          # （北京 08:07-08:52 主时段），本联动仅作兜底，09:05 后才介入。
          # 这样 gold 监控与 wb 签到互不依赖：任一方停摆，另一方仍正常运行。
          BJ_HHMM="$(TZ=Asia/Shanghai date +%H:%M)"
          if [ "${BJ_HHMM}" \< "09:05" ]; then
            echo "北京时间 ${BJ_HHMM}，wb 自身 schedule 主时段（08:07-08:52）尚未结束，本次跳过联动兜底"
            exit 0
          fi

          TODAY="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          CUTOFF="$(date -u -d "${TODAY} 00:00 +0800" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "今日: ${TODAY}，检查窗口起点(UTC): ${CUTOFF}"

          # 1) 邮件今天是否已推送过（状态文件记录，当天只推一次）
          git pull --rebase origin main || true
          LAST=""
          [ -f wb_notify_state.json ] && LAST="$(jq -r '.last_sent_date // ""' wb_notify_state.json 2>/dev/null || echo '')"
          if [ "${LAST}" = "${TODAY}" ]; then
            echo "今日签到邮件已推送过（${LAST}），不再推送"
            exit 0
          fi

          # 2) 确保今天有一次成功的签到运行
          #    - 今日无运行 → 触发
          #    - 今日运行失败（failure/cancelled/timed_out）→ 幂等重试（脚本幂等，不会重复领奖）
          #    - 今日运行进行中 → 等待完成
          get_newest() {
            curl -sS -G "${auth[@]}" --data-urlencode "created=>=${CUTOFF}" --data-urlencode "per_page=1" \
              "${API}/repos/${WB_REPO}/actions/workflows/daily.yml/runs" | jq -r '.workflow_runs[0].id // empty'
          }

          NEWEST="$(get_newest)"
          if [ -n "${NEWEST}" ]; then
            CONC="$(curl -sS "${auth[@]}" "${API}/repos/${WB_REPO}/actions/runs/${NEWEST}" | jq -r '.conclusion // ""')"
          fi

          if [ -z "${NEWEST}" ] || [ "${CONC}" = "failure" ] || [ "${CONC}" = "cancelled" ] || [ "${CONC}" = "timed_out" ]; then
            if [ -n "${NEWEST}" ]; then
              echo "今日已有签到运行但结论为 ${CONC}，幂等重试一次..."
            else
              echo "今日尚无签到运行，触发一次..."
            fi
            curl -sS "${auth[@]}" -X POST -d '{"ref":"main"}' -o /dev/null -w "dispatch HTTP %{http_code}\n" \
              "${API}/repos/${WB_REPO}/actions/workflows/daily.yml/dispatches"
          fi

          for i in $(seq 1 36); do
            sleep 5
            NEWEST="$(get_newest)"
            [ -n "${NEWEST}" ] || continue
            ST="$(curl -sS "${auth[@]}" "${API}/repos/${WB_REPO}/actions/runs/${NEWEST}" | jq -r '.status')"
            [ "${ST}" = "completed" ] && break
          done
          [ -n "${NEWEST}" ] || { echo "::warning::未能获取今日签到运行"; exit 0; }
          ST="$(curl -sS "${auth[@]}" "${API}/repos/${WB_REPO}/actions/runs/${NEWEST}" | jq -r '.status')"
          if [ "${ST}" != "completed" ]; then
            echo "::notice::签到运行仍在进行中（${NEWEST}），下轮 gold 运行再校验并推送邮件"
            exit 0
          fi
          CONC="$(curl -sS "${auth[@]}" "${API}/repos/${WB_REPO}/actions/runs/${NEWEST}" | jq -r '.conclusion // ""')"
          echo "最新签到运行: ${NEWEST}，结论: ${CONC}"

          # 3) 从运行日志确认签到确实成功
          OK="unknown"
          if [ "${CONC}" = "success" ]; then
            curl -sSL "${auth[@]}" "${API}/repos/${WB_REPO}/actions/runs/${NEWEST}/logs" -o /tmp/wb_logs.zip || true
            LINE="$(unzip -p /tmp/wb_logs.zip 2>/dev/null | grep -m1 'RESULT_JSON' | sed 's/^.*RESULT_JSON //' || true)"
            if [ -n "${LINE}" ]; then
              OK="$(echo "${LINE}" | jq -r '.checkin.ok // false')"
            fi
          fi
          echo "签到校验结果: ${OK}"
          if [ "${OK}" = "false" ]; then
            echo "::warning::今日签到未成功，不推送邮件，请检查 workbuddy_auto_checkin 的运行日志"
            exit 0
          fi
          # OK = true，或 conclusion=success 但日志不可读时，视为已完成

          # 4) 通过 Resend 发送邮件
          if [ -z "${RESEND_API_KEY}" ] || [ -z "${FROM_EMAIL}" ]; then
            echo "::warning::缺少 RESEND_API_KEY 或 FROM_EMAIL，无法发送邮件"
            exit 0
          fi
          if [ -n "${SENDER_NAME}" ]; then FROM_VALUE="${SENDER_NAME} <${FROM_EMAIL}>"; else FROM_VALUE="${FROM_EMAIL}"; fi
          BODY="$(jq -n --arg from "${FROM_VALUE}" --arg to "${WB_NOTIFY_EMAIL}" \
            --arg sub "WorkBuddy 每日签到完成" \
            --arg text "今日workbuddy云上签到领积分已自动完成。" \
            '{from:$from, to:[$to], subject:$sub, text:$text}')"
          HTTP_CODE="$(curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" -o /tmp/resend_resp.json -w '%{http_code}')"
          echo "Resend HTTP ${HTTP_CODE}: $(cat /tmp/resend_resp.json)"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::邮件发送失败，下轮运行将重试"
            exit 0
          fi

          # 5) 记录推送日期到状态文件并提交（当天后续运行不再推送）
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git pull --rebase origin main || true
          printf '{"last_sent_date": "%s"}\n' "${TODAY}" > wb_notify_state.json
          git add wb_notify_state.json
          if ! git diff --staged --quiet; then
            git commit -m "wb notify state ${TODAY} [skip ci]" && git push \
              || echo "::warning::状态文件提交失败，下轮可能重复推送一封邮件"
          fi
          echo "已记录推送日期: ${TODAY}"
