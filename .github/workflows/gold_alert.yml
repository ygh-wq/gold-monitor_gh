name: Gold Price Alert

permissions:
  contents: write

on:
  # 外部定时服务精确触发（主要方式，通过 cron-job.org 调用 GitHub API）
  workflow_dispatch:
    inputs:
      force_send:
        description: "强制发送报告"
        type: boolean
        default: false
  # 保留 schedule 作为备份（避开整点，减少延迟）
  schedule:
    # 北京时间 07:00-07:45 (UTC 23:00-23:45)，避开整点
    - cron: "7,22,37,52 23 * * *"
    # 北京时间 08:00-23:00 (UTC 00:00-15:00)，避开整点
    - cron: "7,22,37,52 0-15 * * *"

jobs:
  check-gold-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gold monitor
        env:
          FORCE_SEND: ${{ github.event.inputs.force_send == 'true' && 'true' || 'false' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOLD_GRAMS: ${{ vars.GOLD_GRAMS }}
          INVESTED_AMOUNT: ${{ vars.INVESTED_AMOUNT }}
          DAILY_ALERT_PCT: ${{ vars.DAILY_ALERT_PCT }}
          WEEKLY_ALERT_PCT: ${{ vars.WEEKLY_ALERT_PCT }}
          DAILY_VOLATILITY_TIERS: ${{ vars.DAILY_VOLATILITY_TIERS }}
          WEEKLY_VOLATILITY_TIERS: ${{ vars.WEEKLY_VOLATILITY_TIERS }}
          REPORT_SLOTS: ${{ vars.REPORT_SLOTS }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python gold_monitor.py

      - name: Commit state file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull --rebase origin main || true
          git add state.json
          git diff --staged --quiet || (git commit -m "Update state [skip ci]" && git push)

      - name: 联动触发 workbuddy 每日签到（每天一次，幂等去重）
        if: always()
        env:
          WB_TRIGGER_TOKEN: ${{ secrets.WB_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WB_TRIGGER_TOKEN}" ]; then
            echo "::warning::未配置 WB_TRIGGER_TOKEN，跳过联动触发"
            exit 0
          fi
          # 以北京时间为准，计算今天 0 点对应的 UTC 时刻（签到以北京日为界）
          CUTOFF="$(date -u -d "$(TZ=Asia/Shanghai date +%Y-%m-%d) 00:00 +0800" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "今日检查窗口起点(UTC): ${CUTOFF}"
          # 查询签到工作流今天是否已运行过（含手动触发），跑过就不再重复触发
          COUNT="$(curl -sS -G \
            -H "Authorization: Bearer ${WB_TRIGGER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: gold-monitor" \
            --data-urlencode "created=>=${CUTOFF}" \
            "https://api.github.com/repos/ygh-wq/workbuddy_auto_checkin/actions/workflows/daily.yml/runs" \
            | jq -r '.total_count // 0')"
          echo "签到工作流今日已运行: ${COUNT} 次"
          if [ -n "${COUNT}" ] && [ "${COUNT}" != "0" ]; then
            echo "今天已运行过签到，无需重复触发"
            exit 0
          fi
          HTTP_CODE="$(curl -sS -X POST \
            -H "Authorization: Bearer ${WB_TRIGGER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: gold-monitor" \
            -d '{"ref":"main"}' \
            -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/ygh-wq/workbuddy_auto_checkin/actions/workflows/daily.yml/dispatches")"
          echo "dispatch HTTP ${HTTP_CODE}（204=触发成功）"
          if [ "${HTTP_CODE}" != "204" ]; then
            echo "::warning::触发签到失败，请检查 WB_TRIGGER_TOKEN 是否有效"
          fi
